name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build APK
        run: ./gradlew :app:assembleRelease

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk SquareCamera.apk

      - uses: actions/upload-artifact@v4
        with:
          name: SquareCamera-apk
          path: SquareCamera.apk

      # Replace the previous build's release so the newest one is always at the same link.
      - name: Remove previous build release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release delete "latest-${{ github.ref_name }}" --cleanup-tag --yes || true

      - name: Build date
        id: date
        run: echo "stamp=$(date -u '+%b %d, %H:%M UTC')" >> "$GITHUB_OUTPUT"

      - name: Publish latest build
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-${{ github.ref_name }}
          target_commitish: ${{ github.sha }}
          name: Square Camera — newest build (${{ steps.date.outputs.stamp }})
          make_latest: true
          files: SquareCamera.apk
          body: |
            Built from ${{ github.sha }}.
            On your Android phone: download SquareCamera.apk, open it, and allow installing from your browser when asked.
